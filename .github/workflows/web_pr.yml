name: Web PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Middagsasen.Planner.Web/**'
      - 'src/Middagsasen.Planner.Api/openapi/openapi.json'
      - '.github/workflows/web_pr.yml'
  workflow_dispatch:

# Ny push til samme PR avbryter forrige kjøring
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck og test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Middagsasen.Planner.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Middagsasen.Planner.Web/package-lock.json

      # postinstall kjører `quasar prepare`, som genererer .quasar/tsconfig.json
      - run: npm ci

      - name: Sjekk at API-typer er i synk med openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/types

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test
