# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: middagsasen-planner-API BETA

on:
  push:
    branches:
      - '**'
      - '!main'
    paths:
      - 'src/Middagsasen.Planner.Api/**/*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/beta_middagsasen-planner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Middagsasen.Planner.Api/Middagsasen.Planner.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp
