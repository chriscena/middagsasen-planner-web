name: Azure Static Web Apps PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'src/Middagsasen.Planner.Web/**/*'
      - '.github/workflows/azure-static-web-apps-orange-hill-0d3da3203-PR.yml'

# Ny push til samme PR avbryter forrige preview-deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # Dependabot-/fork-PR-er får ikke secrets: appen bygges fortsatt, men preview deployes ikke.
        # NB: env-variabel, ikke input (se Azure-dokumentasjonen for build-konfigurasjon).
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_0D3DA3203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/src/Middagsasen.Planner.Web' # App source code path
          output_location: 'dist/spa' # Built app content directory - optional
          production_branch: 'main'
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    # Dependabot-PR-er har ingen preview å lukke og mangler token (PR-forfatter, ikke github.actor)
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_0D3DA3203 }}
          app_location: '/src/Middagsasen.Planner.Web' # App source code path
          output_location: 'dist/spa' # Built app content directory - optional
          action: 'close'
          production_branch: 'main'
